# ==========================================================================
# 1. APPLICATION & CORE SERVER CONFIGURATION
# ==========================================================================
spring.application.name=customer-lead-crm
# Dynamically binds to Render's container port allocation, defaulting to 8080 if fallback is needed
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ==========================================================================
# 2. PRODUCTION DATABASE CONFIGURATION (POSTGRESQL)
# ==========================================================================
# Utilizing your explicit External URL with the required JDBC connection mapping syntax prefix
spring.datasource.url=jdbc:postgresql://dpg-d96v5uss728c738cuic0-a.oregon-postgres.render.com:5432/lead_crm_db_3iql
spring.datasource.username=lead_crm_db_3iql_user
spring.datasource.password=zJr4xzeEdouy48XKWSEzXhuzPaM8fNKr
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================================
# 3. JPA / HIBERNATE ORM CONFIGURATIONS
# ==========================================================================
# Keeps schema automatically aligned by mapping objects straight to PostgreSQL entity records
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Console layout handling optimization
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================================================================
# 4. HIKARI CONNECTION POOL SYSTEM SETTINGS
# ==========================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# ==========================================================================
# 5. LOGGING PERFORMANCE ENGINE LEVELS
# ==========================================================================
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# ==========================================================================
# 6. SWAGGER OPENAPI ENDPOINTS (PRODUCTION ROUTING)
# ==========================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html